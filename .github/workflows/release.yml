name: Release

# A tag v1.2.3 builds PCMieru-1.2.3-win-x64.zip plus SHA256.txt and attaches both to a GitHub release.
# A manual run builds the same files from the chosen ref and keeps them as a workflow artifact only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a dry run, for example 0.1.0'
        required: true
        default: '0.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME -replace '^v', '' } else { $v = $env:INPUT_VERSION }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "not a version: '$v'" }
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version $v"

      # Same gate as CI: RealMachine tests need a real workstation (live hardware, real processes, the host registry)
      # and cannot run on a headless runner, so the release is gated on the environment-independent tests.
      - name: Test
        run: dotnet test PcMieru.slnx -c Release --nologo --filter "Category!=RealMachine"

      - name: Publish and run the folder
        shell: pwsh
        run: ./tools/publish.ps1 -Version '${{ steps.version.outputs.value }}' -Verify -SmokeFakes

      - uses: actions/upload-artifact@v4
        with:
          name: PCMieru-${{ steps.version.outputs.value }}-win-x64
          path: |
            dist/PCMieru-*.zip
            dist/SHA256.txt
          if-no-files-found: error

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PCMieru-${{ steps.version.outputs.value }}-win-x64.zip
            dist/SHA256.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
